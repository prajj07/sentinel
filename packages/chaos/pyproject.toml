[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-chaos"
version = "0.1.0"
description = "In-process fault injection and chaos experiment models for Sentinel"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "prometheus-client>=0.21,<1",
  "starlette>=0.40,<1",
  "opentelemetry-api>=1.27,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_chaos*"]
