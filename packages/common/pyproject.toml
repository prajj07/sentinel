[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-common"
version = "0.1.0"
description = "Shared utilities for Sentinel services"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "redis>=5.0,<6",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.0,<3",
  "aio-pika>=9.4,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_common*"]
